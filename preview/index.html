<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island HA Cards · 本地预览</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./preview.css">
</head>
<body>
<div class="preview-bar">
  <strong>本地预览</strong>
  <span class="hint">假数据，不连接任何设备</span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="宽度">
    <button data-width="phone" aria-pressed="false">手机</button>
    <button data-width="tablet" aria-pressed="false">平板</button>
    <button data-width="desktop" aria-pressed="true">电脑</button>
  </div>
  <label class="dark"><input type="checkbox" id="dark"> 深色</label>
  <button id="splash">重播开屏</button>
  <button id="reset">重置</button>
</div>

<div id="frame" data-width="desktop">
  <div class="ha-shell">
    <header class="ha-toolbar">
      <span class="ha-menu" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="ha-title"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8.5 39.5C8.5 21 19.5 8.5 40 7.5c0 20.5-12.5 32-31.5 32z" fill="#a6e36a"/><path d="M8.5 39.5C27 39.5 39.5 28 40 7.5z" fill="#86d052"/><path d="M9 39C17.5 30 25 22.5 34 14" stroke="#5fb43a" stroke-width="3" stroke-linecap="round" fill="none"/></svg>我的小岛</span>
    </header>
    <main class="ha-view">
      <div id="view" class="sections"></div>
    </main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/dist/island-ha-cards.js"></script>
<script type="module" src="./main.bundle.js"></script>
</body>
</html>
