<section class="testing-panel" aria-label="隔离验证工具"><details><summary>查看模拟状态与交互记录</summary><aside aria-label="测试控制"><label>模拟状态 <select id="mode"><option value="normal">正常</option><option value="unknown">未知</option><option value="unavailable">不可用</option><option value="missing">实体不可见</option><option value="denied">权限拒绝</option><option value="error">服务错误</option><option value="readonly">只读</option><option value="no-service">服务缺失</option><option value="pending">等待响应</option></select></label><label>设备场景 <select id="scenario"><option value="normal">默认设备状态</option><option value="print-paused">打印已暂停</option><option value="print-running">打印中</option><option value="print-unavailable">打印状态不可用</option><option value="cover-moving">窗帘关闭中</option><option value="media-paused">媒体已暂停</option><option value="climate-idle">空调待机</option><option value="all-alt">灯关 · 制热 · 洗衣完成</option><option value="light-on">灯光开启</option><option value="light-dim">低亮度</option><option value="climate-heat">制热运行</option><option value="climate-cool">制冷运行</option><option value="laundry-running">洗衣运行</option><option value="laundry-done">洗衣完成</option><option value="light-off">灯光关闭</option></select></label><button id="release">释放等待响应</button><button id="update">更新亮度状态</button><button id="clear">清空调用记录</button><output id="calls" aria-live="polite">0 次 mock 服务调用</output></aside><section id="editor-tools"><button id="edit-light" aria-expanded="false" aria-controls="editor-panel">编辑灯光卡片</button><section id="editor-panel" hidden><h2>灯光卡片配置</h2></section></section></details></section>
