name: Real Home Assistant parity
on:
  workflow_dispatch:
  push:
    branches: [main, fix/pr1-three-way-review]
permissions:
  contents: read
concurrency:
  group: parity-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HA_VERSION: '2026.9.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test && node --test tests/island-ui/*.test.mjs
      - run: node scripts/build-parity.mjs
      - run: node scripts/ha-parity/three-way-build.mjs
      - run: node --test tests/three-way/*.test.mjs
      - run: node scripts/build-parity-preview.mjs
      - run: PARITY_STATIC_ONLY=1 node tests/parity-preview/check.mjs
      - name: Verify release rejection gates
        run: node --test tests/parity-preview/assembly.test.mjs
      - run: node scripts/ha-parity/prepare.mjs
      - name: Start isolated official Home Assistant
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:${HA_VERSION}
          mkdir -p ha-evidence
          docker image inspect ghcr.io/home-assistant/home-assistant:${HA_VERSION} --format '{{json .RepoDigests}}' > ha-evidence/image-digest.json
          docker run -d --name parity-ha -p 127.0.0.1:8123:8123 -v "$PWD/.ha-runtime:/config" ghcr.io/home-assistant/home-assistant:${HA_VERSION}
      - run: node scripts/ha-parity/bootstrap.mjs
      - run: npx playwright install --with-deps chromium
      - name: Install recording tools from official Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg xvfb xauth
          command -v ffmpeg
          command -v ffprobe
          command -v xvfb-run
          command -v xauth
      - run: HA_HEADED=1 xvfb-run -a npx playwright test --config tests/ha-parity/playwright.config.ts
      - name: Summarize only observed evidence
        if: always()
        run: node scripts/ha-parity/report.mjs
      - name: Assemble verified comparison preview
        run: node scripts/assemble-parity-preview.mjs
      - name: Check all comparison rows and mobile layouts
        run: node tests/parity-preview/check.mjs
      - name: Build verified three-way comparison
        run: node scripts/build-three-way.mjs
      - name: Preserve published root and add three-way page
        run: node scripts/assemble-three-way-site.mjs
      - name: Verify three-way gallery and downloads
        run: node tests/three-way/browser-check.mjs
      - name: Upload verified install bundle
        uses: actions/upload-artifact@v4
        with:
          name: parity-ha-card-bundle
          path: dist/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Upload comparison browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-preview-evidence
          path: tests/parity-preview/artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ha-parity-evidence
          path: ha-evidence/
          retention-days: 7
      - name: Destroy ephemeral runtime and credentials
        if: always()
        run: |
          docker rm -f parity-ha || true
          sudo rm -rf .ha-runtime .ha-secrets .ha-test-results .ha-motion-video
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: real-ha
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
