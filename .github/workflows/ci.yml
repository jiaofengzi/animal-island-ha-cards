name: CI
# 每次推送和 PR：lint、类型检查、单元测试、构建安装包。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: |
          test -s dist/island-ha-cards.js
          test -s dist/fonts/island-rounded-500.woff2
      - uses: actions/upload-artifact@v4
        with:
          name: island-ha-cards-dist
          path: dist/
          retention-days: 14
