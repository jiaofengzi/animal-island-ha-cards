name: Legacy 23-case regression (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check:legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-browser-evidence
          path: .cache/legacy-project/test-results/
          retention-days: 7
