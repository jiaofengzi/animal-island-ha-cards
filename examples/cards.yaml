# 由 preview/dashboard.js 生成：把示例实体 ID 换成你自己家里的。
# 单张卡片示例，字段与 Mushroom v5.2.3 一致，只是类型前缀为 island-。
- type: custom:island-splash-card
  title: 我的小岛
  mode: session
- type: custom:island-title-card
  title: 早上好，岛民！
  subtitle: 今天也是悠闲的一天
- type: custom:island-chips-card
  chips:
  - type: weather
    entity: weather.home
    show_conditions: true
    show_temperature: true
  - type: entity
    entity: sensor.living_temperature
  - type: light
    entity: light.living_lamp
    use_light_color: true
  - type: template
    icon: mdi:music
    content: '{{ state_attr(''media_player.living_speaker'', ''media_title'') }}'
    entity: media_player.living_speaker
  - type: alarm-control-panel
    entity: alarm_control_panel.home
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-person-card
  entity: person.me
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-person-card
  entity: person.friend
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-lock-card
  entity: lock.front_door
  tap_action:
    action: toggle
- type: custom:island-alarm-control-panel-card
  entity: alarm_control_panel.home
  states:
  - armed_home
  - armed_away
- type: custom:island-title-card
  title: 客厅
- type: custom:island-light-card
  entity: light.living_lamp
  show_brightness_control: true
  show_color_temp_control: true
  show_color_control: true
  use_light_color: true
  tap_action:
    action: toggle
- type: custom:island-climate-card
  entity: climate.living_ac
  show_temperature_control: true
  hvac_modes:
  - cool
  - heat
  - dry
  - 'off'
- type: custom:island-media-player-card
  entity: media_player.living_speaker
  use_media_info: true
  show_volume_level: true
  media_controls:
  - on_off
  - previous
  - play_pause_stop
  - next
  volume_controls:
  - volume_mute
  - volume_set
- type: custom:island-cover-card
  entity: cover.living_curtain
  show_buttons_control: true
  show_position_control: true
- type: custom:island-title-card
  title: 卧室
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-light-card
  entity: light.bedroom_lamp
  tap_action:
    action: toggle
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-entity-card
  entity: switch.kettle
  tap_action:
    action: toggle
- layout: vertical
  fill_container: true
  grid_options:
    columns: 4
  type: custom:island-entity-card
  entity: sensor.living_humidity
- type: custom:island-fan-card
  entity: fan.bedroom_fan
  show_percentage_control: true
  show_oscillate_control: true
  icon_animation: true
- type: custom:island-humidifier-card
  entity: humidifier.bedroom
  show_target_humidity_control: true
- type: custom:island-title-card
  title: 家务
- type: custom:island-vacuum-card
  entity: vacuum.robot
  commands:
  - start_pause
  - stop
  - locate
  - return_home
- type: custom:island-number-card
  entity: number.feeder
  display_mode: buttons
- type: custom:island-select-card
  entity: select.washer_mode
- type: custom:island-update-card
  entity: update.home_assistant
  tap_action:
    action: perform-action
    perform_action: update.install
    target:
      entity_id: update.home_assistant
- type: custom:island-navbar-card
  items:
  - name: 首页
    icon: island:house
    path: ?view=home
  - name: 客厅
    icon: island:sofa
    path: ?view=living
  - name: 卧室
    icon: island:bed
    path: ?view=bedroom
  - name: 家务
    icon: island:washer
    path: ?view=chores
